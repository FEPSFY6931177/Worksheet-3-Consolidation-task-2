<!DOCTYPE HTML>
<html>
	<head>
		<title>Worksheet 3 Consolidation task 2</title>
	</head>

	<body>
		<p id="randomText">I will be a random number!</p>
		<button type="button" id="randomizerButton">Press me!</button>

		<script>
			// SOL) can just use one comment for these: // Get a reference to the button and the paragraph
			// Get a reference to the paragraph element to be changed
			var randomText = document.getElementById("randomText");
			// Get a reference to the button element
			var randomizerButton = document.getElementById("randomizerButton");

			// Function to display random number between 1 and 10 in randomText paragraph
			function randomize() {
				/* SOL) can state what the output is more gracefully
				var randomNumber = Math.floor(Math.random() * 10) + 1;
				randomText.textContent = "Random Number : " + randomNumber;
				*/
				
				randomText.textContent = String(Math.floor(Math.random() * 10) + 1);
			}

			// Add a click event listener to the button
			randomizerButton.addEventListener("click" , randomize);
		</script>
	</body>
</html>
